<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morning Report - RSUD dr. R. Koesma</title>
    <link rel="icon" type="image/jpeg" href="https://files.catbox.moe/c4lwfb.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); background-attachment: fixed; }
        .glass-card { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); transition: all 0.3s ease; }
        .glass-button { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.4); transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
        .glass-button:hover { background: rgba(255, 255, 255, 0.4); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15); transform: translateY(-2px); }
        .glass-button:disabled { background: rgba(255, 255, 255, 0.1); cursor: not-allowed; opacity: 0.5; }
        .modal-backdrop { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); }
        .table-glass thead { background: rgba(255, 255, 255, 0.3); }
        .table-glass tbody tr { background: rgba(255, 255, 255, 0.15); border-bottom: 1px solid rgba(255, 255, 255, 0.2); }
        .loader { border: 4px solid rgba(255, 255, 255, 0.3); border-left-color: #fff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #signature-canvas { border: 1px solid #e2e8f0; border-radius: 0.5rem; cursor: crosshair; background-color: #ffffff; width: 100%; height: 100%; }
        
        #sticky-header {
            transform: translateY(-100%);
            transition: transform 0.3s ease-in-out;
        }
        #sticky-header.show {
            transform: translateY(0);
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Sticky Header (tidak berubah) -->
    <div id="sticky-header" class="fixed top-0 left-0 w-full z-40 glass-card shadow-lg">...</div>

    <div id="app-loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-sky-500">...</div>

    <div class="container mx-auto p-4 md:p-6 max-w-5xl">
        <!-- Header Utama (tidak berubah) -->
        <header class="text-center pt-8 mb-6">...</header>

        <!-- Main Content (tidak berubah) -->
        <main>...</main>

        <!-- Footer (tidak berubah) -->
        <footer class="text-center mt-8">...</footer>
    </div>

    <!-- Modals -->
    <div id="attendance-modal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
        <div class="glass-card rounded-2xl p-6 w-11/12 max-w-md shadow-2xl">
            <h3 class="text-xl font-bold text-white mb-4">Input Daftar Hadir</h3>
            <form id="attendance-form" class="space-y-4">
                <div>
                    <label for="name-input" class="text-white/80 text-sm mb-1 block">Nama Lengkap</label>
                    <input id="name-input" list="attendee-names-list" name="name" placeholder="Ketik atau pilih nama" class="w-full p-2 rounded-lg bg-white/50 border border-white/50 text-gray-800 placeholder-gray-600" required>
                    <datalist id="attendee-names-list"></datalist>
                </div>
                <!-- [DIHAPUS] Kolom input NIP tidak ada lagi -->
                <input type="text" name="unit" placeholder="Unit / Bagian" class="w-full p-2 rounded-lg bg-white/50 border border-white/50 text-gray-800 placeholder-gray-600" required>
                <div>
                    <label class="text-white/80 text-sm mb-1 block">Tanda Tangan di sini:</label>
                    <div id="signature-pad-wrapper" class="relative w-full h-40">
                        <canvas id="signature-canvas"></canvas>
                    </div>
                    <button type="button" id="clear-signature-button" class="text-xs text-white/80 hover:text-white mt-1">Bersihkan</button>
                </div>
                <div class="flex gap-4 pt-2">
                    <button type="submit" class="glass-button flex-1 py-2 px-4 rounded-lg text-white font-semibold">Kirim</button>
                    <button type="button" onclick="hideModal('attendance-modal')" class="bg-red-500/50 hover:bg-red-500/80 flex-1 py-2 px-4 rounded-lg text-white font-semibold transition">Batal</button>
                </div>
            </form>
        </div>
    </div>
    <div id="view-attendance-modal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
        <div class="glass-card rounded-2xl p-6 w-11/12 max-w-4xl shadow-2xl max-h-[80vh] flex flex-col">
            <h3 class="text-xl font-bold text-white mb-4">Daftar Kehadiran</h3>
            <div id="attendance-list-container" class="overflow-auto flex-grow">
                <div id="attendance-loader" class="flex justify-center items-center h-full"><div class="loader"></div></div>
                <table id="attendance-table" class="w-full text-white table-auto table-glass hidden">
                    <thead class="text-left">
                        <tr>
                            <!-- [DIHAPUS] Kolom header NIP tidak ada lagi -->
                            <th class="p-2">Waktu</th><th class="p-2">Nama</th><th class="p-2">Unit</th><th class="p-2">Tanda Tangan</th>
                        </tr>
                    </thead>
                    <tbody id="attendance-table-body"></tbody>
                </table>
            </div>
            <div id="pagination-controls" class="flex justify-between items-center mt-4 text-white hidden">...</div>
            <button type="button" onclick="hideModal('view-attendance-modal')" class="bg-red-500/50 hover:bg-red-500/80 w-full mt-4 py-2 px-4 rounded-lg text-white font-semibold transition">Tutup</button>
        </div>
    </div>
    <!-- Modal lainnya tidak berubah -->
    <div id="admin-login-modal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">...</div>
    <div id="upload-report-modal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">...</div>
    <div id="archive-modal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">...</div>
    <div id="toast" class="fixed bottom-5 right-5 z-50 glass-card p-4 rounded-lg shadow-2xl hidden transform translate-y-20 transition-transform duration-500">...</div>


    <script>
        // --- KONFIGURASI & VARIABEL GLOBAL (tidak berubah) ---
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbya-XiYph0VQXjgNLfWXQ-qmkk7q4HcU7N6g0x-PCIvrMHhILl9p-_aNUWd-zOUdAWH/exec';
        // ...variabel global lainnya...

        // --- FUNGSI HELPER (tidak berubah) ---
        // ...showModal, hideModal, resizeSignatureCanvas, dll...

        // [DIUBAH] Fungsi render untuk tabel tanpa NIP
        function renderAttendancePage() {
            const tbody = document.getElementById('attendance-table-body');
            // ... (logika paginasi lainnya) ...
            if (!tbody) return;
            tbody.innerHTML = '';
            if (fullAttendanceData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center">Belum ada data kehadiran.</td></tr>'; // Colspan jadi 4
                // ...
                return;
            }
            // ...
            paginatedItems.forEach(row => {
                const signatureCell = row.signatureUrl ? `<a href="${row.signatureUrl}" target="_blank" class="text-sky-300 hover:text-sky-100">Lihat</a>` : 'Tidak ada';
                // [DIHAPUS] Kolom NIP tidak dirender
                tbody.innerHTML += `<tr><td class="p-2">${row.timestamp}</td><td class="p-2">${row.name}</td><td class="p-2">${row.unit}</td><td class="p-2">${signatureCell}</td></tr>`;
            });
            // ...
        }

        // --- INISIALISASI UTAMA & EVENT LISTENERS ---
        document.addEventListener('DOMContentLoaded', async () => {
            // ... (inisialisasi lainnya) ...

            // [DIUBAH] Event listener untuk auto-fill tanpa NIP
            const nameInput = document.getElementById('name-input');
            if (nameInput) {
                nameInput.addEventListener('input', (e) => {
                    const selectedName = e.target.value;
                    const attendeeRecord = allAttendeesData.find(record => record.name === selectedName);
                    const form = document.getElementById('attendance-form');
                    if (form && attendeeRecord) {
                        form.unit.value = attendeeRecord.unit; // Hanya mengisi unit
                        // form.nip.value dihapus
                    }
                });
            }

            // [DIUBAH] Event listener untuk submit form tanpa NIP
            document.getElementById('attendance-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (signaturePad.isEmpty()) {
                    showToast("Mohon bubuhkan tanda tangan Anda.", true);
                    return;
                }
                const form = e.target;
                const signatureData = signaturePad.toDataURL('image/png');
                // [DIUBAH] Objek data tidak lagi menyertakan NIP
                const data = { name: form.name.value, unit: form.unit.value, signature: signatureData };
                showToast('Mengirim data kehadiran...');
                hideModal('attendance-modal');
                const result = await callGAS({ action: 'recordAttendance', data: data });
                if (result) {
                    showToast(result.message);
                    form.reset();
                    signaturePad.clear();
                }
            });

            // ... (sisa event listener lainnya) ...
        });

        // ... (sisa kode JavaScript lainnya) ...
    </script>
</body>
</html>
